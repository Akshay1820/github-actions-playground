name: My First GitHub Action

on:
  pull_request:
    types: [opened]

jobs:
  explorer-runner:
    runs-on: ubuntu-latest
    steps:
      - name: Downloading repo
        uses: actions/checkout@v4

      - name: Java version before installing
        run: |
          echo "Current Java Version:"
          java -version

      - name: Installing java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21' 

      - name: Java version after installing
        run: |
          echo "Updated Java Version:"
          java -version
