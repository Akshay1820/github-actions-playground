name: Environment variable demo

on:
  workflow_dispatch

env:
  APP_NAME: GitHub Actions Playground
  JAVA_VERSION: 21


jobs:
  env-demo:
    runs-on: ubuntu-latest
    steps:
      - name: Downloading repo
        uses: actions/checkout@v4

      - name: Printing environment variables
        run: | 
          echo "Application: $APP_NAME"
          echo "Java version: $JAVA_VERSION"

